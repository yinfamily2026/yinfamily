<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="尹氏家谱">
<meta name="theme-color" content="#5f3f28">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>尹氏家谱</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar">
  <div class="topbar-inner">
    <h1 id="clanTitle">尹氏家族</h1>
    <span id="syncStatus" class="sync-status" title="数据同步状态">●</span>
  </div>
</header>

<main id="main">
  <!-- 世系树 -->
  <section id="page-tree" class="page active">
    <div class="page-title">
      <span>世系图</span>
      <button class="btn small" id="btnResetTree">复位</button>
    </div>
    <div id="treeWrap">
      <svg id="treeSvg"></svg>
      <div id="treeHint">双指缩放 · 拖动浏览 · 点击查看族人</div>
    </div>
  </section>

  <!-- 成员列表 -->
  <section id="page-members" class="page">
    <div class="page-title">
      <span>成员名录</span>
      <button class="btn small" id="btnAddQuick">＋ 新增</button>
    </div>
    <div id="memberList"></div>
  </section>

  <!-- 续谱：新增/编辑成员 -->
  <section id="page-add" class="page">
    <div class="page-title"><span id="formTitle">续谱 · 新增成员</span></div>
    <form id="memberForm" autocomplete="off">
      <input type="hidden" id="f_id">
      <label>姓名 <input type="text" id="f_name" required placeholder="姓名（如：尹XX）"></label>
      <label>性别
        <select id="f_gender">
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </label>
      <label>世数（第几世） <input type="number" id="f_generation" min="1" placeholder="如 5"></label>
      <label>房支 <input type="text" id="f_branch" placeholder="如：长房 / 二房"></label>
      <label>父亲（从现有成员中选择）
        <select id="f_father"><option value="">— 无（始祖或配偶） —</option></select>
      </label>
      <label>配偶（从现有成员中选择，可后补）
        <select id="f_spouse"><option value="">— 无 —</option></select>
      </label>
      <label>出生 <input type="text" id="f_birth" placeholder="如：1930年或1930-05-01"></label>
      <label>逝世 <input type="text" id="f_death" placeholder="如：2005年"></label>
      <label>籍贯 <input type="text" id="f_birthPlace" placeholder="如：山东临沂"></label>
      <label>安葬地 <input type="text" id="f_burialPlace" placeholder="如：村南祖茔"></label>
      <label>生平简介 <textarea id="f_bio" rows="3" placeholder="生平事迹、功名、简要记录"></textarea></label>
      <div class="form-actions">
        <button type="submit" class="btn primary" id="btnSave">保存</button>
        <button type="button" class="btn" id="btnCancelForm">取消</button>
      </div>
    </form>
  </section>

  <!-- 设置 -->
  <section id="page-settings" class="page">
    <div class="page-title"><span>设置</span></div>
    <div class="card">
      <h3>联网同步</h3>
      <p class="hint">填入家谱服务器的地址（部署后形如 http://192.168.1.5:3000），手机与家人即可共享同一份族谱。</p>
      <input type="text" id="s_server" placeholder="http://服务器IP:3000">
      <div class="row">
        <button class="btn" id="btnConnect">测试并连接</button>
        <span id="s_connState" class="hint">未连接</span>
      </div>
      <p class="hint">写入令牌（可选）：服务器启用了令牌时填写，用于提交修改。</p>
      <input type="password" id="s_token" placeholder="管理令牌">
    </div>
    <div class="card">
      <h3>数据备份</h3>
      <div class="row">
        <button class="btn" id="btn_exportJson">导出 JSON</button>
        <label class="btn file">导入 JSON<input type="file" id="btn_importJson" accept=".json,application/json"></label>
      </div>
      <p class="hint">导出文件可随时导入或保存，防止数据丢失。</p>
    </div>
    <div class="card">
      <h3>族谱打印</h3>
      <button class="btn" id="btn_print">打印/导出族谱</button>
      <p class="hint">以纸质谱牒样式（按世次）整理排版，可保存为 PDF。</p>
    </div>
    <div class="card">
      <h3>编辑管理</h3>
      <button class="btn danger" id="btn_resetLocal">重置本地数据</button>
      <p class="hint">清空本地缓存数据并从服务器重新加载。</p>
    </div>
    <div class="about">尹氏家谱 · 移动端族谱管理系统</div>
  </section>
</main>

<nav id="tabbar">
  <button class="tab active" data-page="tree">世系</button>
  <button class="tab" data-page="members">名录</button>
  <button class="tab" data-page="add">续谱</button>
  <button class="tab" data-page="settings">设置</button>
</nav>

<!-- 成员详情弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="m_name"></h2>
    <div id="m_info" class="m-info"></div>
    <div class="row">
      <button class="btn primary" id="btn_editMember">编辑</button>
      <button class="btn danger" id="btn_delMember">删除</button>
      <button class="btn" id="btn_closeModal">关闭</button>
    </div>
  </div>
</div>

<!-- 打印用族谱 -->
<div id="printArea"></div>

<script src="js/api.js"></script>
<script src="js/tree.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
